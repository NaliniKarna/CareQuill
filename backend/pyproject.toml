[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder makes ruff mistake the alembic
# package for first-party code; it is a third-party dependency.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["alembic/versions"]
