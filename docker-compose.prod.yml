# Production-oriented compose file: multi-stage images, no bind mounts, no
# --reload, gunicorn workers for the API and the standalone Next.js bundle for
# the UI. It is ALSO the fast way to run the app on a laptop: bind-mounted
# source trees and `next dev` are what make the dev stack slow on Windows.
#
# 1. cp .env.production.example .env.production   (fill in the secrets)
# 2. docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# See docs/deployment.md for reverse-proxy/TLS and managed-database variants.

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medqueue}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-medqueue_ai}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (openssl rand -hex 32)}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  BACKEND_HOST: 0.0.0.0
  BACKEND_PORT: 8000
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_LOCAL_PATH: /app/storage/medical_documents
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-15}
  ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS:-.pdf,.png,.jpg,.jpeg}
  EMAIL_BACKEND: ${EMAIL_BACKEND:?EMAIL_BACKEND must be smtp, sendgrid or mailgun}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@medqueue.ai}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-MedQueue AI}
  SMTP_HOST: ${SMTP_HOST:-localhost}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
  MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
  MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
  AI_ENABLED: ${AI_ENABLED:-true}
  AI_PROVIDER: ${AI_PROVIDER:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
  AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-v1}
  OCR_ENABLED: ${OCR_ENABLED:-true}
  OCR_ENGINE: ${OCR_ENGINE:-tesseract}
  OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
  AI_DOCUMENT_EXTRACTION_ENABLED: ${AI_DOCUMENT_EXTRACTION_ENABLED:-true}
  AI_DOCUMENT_EXPLAIN_ENABLED: ${AI_DOCUMENT_EXPLAIN_ENABLED:-true}
  AI_VISION_ENABLED: ${AI_VISION_ENABLED:-false}
  OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llama3.2-vision}
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}

services:
  db:
    image: postgres:16-alpine
    container_name: medqueue-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-medqueue_ai}
    volumes:
      - medqueue_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medqueue} -d ${POSTGRES_DB:-medqueue_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port: only the backend reaches the database, inside the
    # compose network.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: medqueue-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - medqueue_storage:/app/storage
    # Migrations run once here; the Dockerfile CMD (gunicorn) is the
    # actual server. With several replicas, run migrations as a separate job.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head && exec gunicorn app.main:app
        -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
        -w $${WEB_CONCURRENCY:-2} --timeout 120 --graceful-timeout 30
        --access-logfile - --forwarded-allow-ips='*'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: medqueue-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional local LLM runtime: docker compose -f docker-compose.prod.yml --profile ai up -d
  ollama:
    image: ollama/ollama:latest
    container_name: medqueue-ollama
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - medqueue_ollama_data:/root/.ollama

volumes:
  medqueue_pg_data:
  medqueue_storage:
  medqueue_ollama_data:
